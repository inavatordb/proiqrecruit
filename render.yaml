services:
  - type: web
    name: recruit
    runtime: node
    plan: starter            # a persistent disk requires a paid plan
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    disk:
      name: recruit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAILS
        sync: false          # set in the Render dashboard
      - key: PUBLIC_APP_URL
        sync: false
